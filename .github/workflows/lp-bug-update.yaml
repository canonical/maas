name: Update Launchpad Bug

on:
  push:
    branches:
      - master
      - '[0-9]+.[0-9]+'

permissions:
  contents: read
  pull-requests: read

jobs:
  update-launchpad-bug:
    runs-on: ubuntu-slim

    steps:
      - name: Extract Launchpad bug ID
        id: extract-bug
        env:
          GITHUB_EVENT_JSON: ${{ toJson(github.event) }}
        run: |
          CLOSING_KEYWORDS='close|closes|closed|fix|fixes|fixed|resolve|resolves|resolved'
          while IFS=$'\t' read -r commit_sha commit_message; do
            BUG_ID=$(grep -oiP "\b(?:$CLOSING_KEYWORDS)\b.*lp:\s*#\K[0-9]+" <<< "$commit_message" | head -1 || true)
            if [ -n "$BUG_ID" ]; then
              break
            fi
          done < <(jq -r '.commits[] | [.id, .message] | @tsv' <<< "$GITHUB_EVENT_JSON")

          if [ -z "$BUG_ID" ]; then
            echo "No Launchpad bug ID found."
            exit 0
          fi

          echo "Launchpad bug ID found: $BUG_ID"
          echo "bug_id=$BUG_ID" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$commit_sha" >> "$GITHUB_OUTPUT"

      - name: Find pull request or commit link
        id: fix-link
        if: steps.extract-bug.outputs.bug_id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_SHA: ${{ steps.extract-bug.outputs.commit_sha }}
        run: |
          PR_URL=$(curl --silent --show-error --fail \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/commits/$COMMIT_SHA/pulls" \
            | jq -r '[.[] | select(.merged_at != null)][0].html_url // empty' \
            || true)

          FIX_URL="${PR_URL:-$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$COMMIT_SHA}"
          echo "fix_url=$FIX_URL" >> "$GITHUB_OUTPUT"
          echo "Fix link: $FIX_URL"

      - name: Checkout code
        if: steps.extract-bug.outputs.bug_id != ''
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up Python
        if: steps.extract-bug.outputs.bug_id != ''
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v.5.6.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        if: steps.extract-bug.outputs.bug_id != ''
        run: pip install launchpadlib

      - name: Update bug status to Fix Committed
        if: steps.extract-bug.outputs.bug_id != ''
        env:
          LANDER_LP_CONSUMER_KEY: ${{ secrets.LANDER_LP_CONSUMER_KEY }}
          LANDER_LP_ACCESS_TOKEN: ${{ secrets.LANDER_LP_ACCESS_TOKEN }}
          LANDER_LP_ACCESS_TOKEN_SECRET: ${{ secrets.LANDER_LP_ACCESS_TOKEN_SECRET }}
          BUG_ID: ${{ steps.extract-bug.outputs.bug_id }}
          BRANCH: ${{ github.ref_name }}
          FIX_URL: ${{ steps.fix-link.outputs.fix_url }}
        run: python3 utilities/mark_lp_bug_fix_committed.py
