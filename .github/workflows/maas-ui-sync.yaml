name: Update maas-ui sync git submodule
on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches:
      - "maas-ui-sync-debug-*"

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  sync:
    name: Sync ${{ matrix.maas_branch }}
    runs-on: ubuntu-24.04
    concurrency:
      group: ${{ github.workflow }}-${{ startsWith(github.ref_name, 'maas-ui-sync-debug-') && github.ref_name || 'sync' }}-${{ matrix.maas_branch }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        maas_branch: ["master", "3.6", "3.7", "3.8"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ matrix.maas_branch }}
          submodules: recursive
          fetch-depth: 0
          token: ${{ secrets.LANDER_GH_TOKEN }}

      - name: Compare submodule and upstream commits
        id: compare
        env:
          SYNC_BRANCH: ${{ matrix.maas_branch }}
        run: |
          set -o pipefail

          target_branch=$SYNC_BRANCH
          if [[ "$SYNC_BRANCH" == "master" ]]; then
            ui_branch=main
          else
            ui_branch=$SYNC_BRANCH
          fi

          latest_commit=$(git ls-remote --exit-code https://github.com/canonical/maas-ui "refs/heads/$ui_branch" | awk '{print $1}')
          current_commit=$(git rev-parse HEAD:src/maasui/src)
          git -C src/maasui/src fetch origin "$latest_commit"

          echo "target_branch=$target_branch" >> "$GITHUB_OUTPUT"
          echo "ui_branch=$ui_branch" >> "$GITHUB_OUTPUT"
          echo "latest_commit=$latest_commit" >> "$GITHUB_OUTPUT"

          if [[ "$latest_commit" == "$current_commit" ]]; then
            echo "has_update=false" >> "$GITHUB_OUTPUT"
            echo "No update needed for $target_branch. Submodule already points to $current_commit"
          else
            echo "has_update=true" >> "$GITHUB_OUTPUT"
            echo "Update needed for $target_branch from maas-ui $ui_branch: $current_commit -> $latest_commit"
          fi

      - name: Update maas-ui submodule
        if: steps.compare.outputs.has_update == 'true'
        env:
          LATEST_COMMIT: ${{ steps.compare.outputs.latest_commit }}
        run: |
          git -C src/maasui/src checkout --detach "$LATEST_COMMIT"

          # Commit locally (without pushing) so that `git rev-parse HEAD:./src`
          # in src/maasui/Makefile reflects the new commit during the snap
          # build below, instead of the stale one still in HEAD. This is only
          # pushed to the remote in "Push submodule update", after the smoke
          # test has passed.
          git config user.name "${{ vars.LANDER_USERNAME }}"
          git config user.email "${{ vars.LANDER_EMAIL }}"
          git add src/maasui/src
          git commit -m "chore: update maas-ui to $LATEST_COMMIT"

      - name: Setup LXD
        uses: canonical/setup-lxd@v1
        with:
          channel: 5.21/stable

      - name: Build MAAS snap
        run: |
          sudo snap install snapcraft --classic
          sudo snap refresh snapd
          sudo snap install --edge core26
          cd "$GITHUB_WORKSPACE"
          make snap
          make snap-clean

      - name: Setup LXD container
        id: setup-lxd
        run: |
          cd "$GITHUB_WORKSPACE"
          lxc launch ubuntu:resolute maas-ui-tester-backend
          lxc exec maas-ui-tester-backend -- cloud-init status --wait
          lxc exec maas-ui-tester-backend -- snap install snapd --beta
          lxc exec maas-ui-tester-backend -- snap wait system seed.loaded
          lxc exec maas-ui-tester-backend -- snap install --edge core26
          lxc file push *.snap maas-ui-tester-backend/maas-snap
          lxc file push utilities/connect-snap-interfaces maas-ui-tester-backend/connect-snap-interfaces
          lxc exec maas-ui-tester-backend -- snap install maas-test-db --channel=latest/edge
          lxc exec maas-ui-tester-backend -- snap install /maas-snap --dangerous
          lxc exec maas-ui-tester-backend -- /connect-snap-interfaces
          MAAS_IP=$(lxc query /1.0/containers/maas-ui-tester-backend/state \
            | jq -er '[.network.eth0.addresses[] | select(.family == "inet" and .scope == "global") | .address | select(length > 0)][0]')
          echo "maas_ip=$MAAS_IP" >> "$GITHUB_OUTPUT"

      - name: Initialize MAAS
        timeout-minutes: 10
        env:
          MAAS_IP: ${{ steps.setup-lxd.outputs.maas_ip }}
        run: |
          lxc exec maas-ui-tester-backend -- maas init region+rack --maas-url="http://${MAAS_IP}:5240/MAAS" --database-uri maas-test-db:///
          for attempt in {1..30}; do
            if status_code=$(curl --noproxy "$MAAS_IP" -L \
              "http://${MAAS_IP}:5240/MAAS/api/2.0/version/" \
              --connect-timeout 5 --max-time 10 \
              -o /dev/null -w "%{http_code}" -sS); then
              if [[ "$status_code" == "200" ]]; then
                echo "MAAS API is ready"
                exit 0
              fi
              echo "Attempt $attempt/30: MAAS API returned HTTP $status_code"
            else
              echo "Attempt $attempt/30: MAAS API request failed"
            fi
            if [[ "$attempt" -lt 30 ]]; then
              sleep 5
            fi
          done
          echo "::error::MAAS API did not become ready after 30 attempts"
          exit 1

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Test
        env:
          MAAS_IP: ${{ steps.setup-lxd.outputs.maas_ip }}
        run: |
          export CYPRESS_BASE_URL="http://${MAAS_IP}:5240"

          mkdir /tmp/cypress-test
          cd /tmp/cypress-test
          npm init -y
          npm install --save-exact cypress@16.0.0

          mkdir -p cypress/e2e
          mkdir -p cypress/support
          touch cypress/support/e2e.js
          echo 'const { defineConfig } = require("cypress"); module.exports = defineConfig({ e2e: { setupNodeEvents(on, config) {} } });' > cypress.config.js
          echo 'describe("MAAS UI sync check", () => { it("loads and shows the initial setup page", () => { cy.visit("/MAAS/r/"); cy.get("#maas-ui", { timeout: 30000 }).should("exist"); cy.contains(/Loading/i, { timeout: 30000 }).should("not.exist"); cy.contains("Failed to connect").should("not.exist"); cy.get(".p-card__title", { timeout: 30000 }).should("contain", "No admin user has been created yet"); }); });' > cypress/e2e/sync-check.cy.js
          npx cypress run

      - name: Upload Cypress screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots-${{ matrix.maas_branch }}
          path: /tmp/cypress-test/cypress/screenshots
          if-no-files-found: ignore

      - name: Collect MAAS diagnostics
        if: failure() && steps.setup-lxd.outcome == 'success'
        run: |
          lxc exec maas-ui-tester-backend -- journalctl --no-pager -n 200
          lxc exec maas-ui-tester-backend -- snap logs maas -n=200

      - name: Push submodule update
        if: |
          steps.compare.outputs.has_update == 'true' &&
          !startsWith(github.ref_name, 'maas-ui-sync-debug-')
        env:
          TARGET_BRANCH: ${{ steps.compare.outputs.target_branch }}
        run: |
          if ! git push origin "HEAD:$TARGET_BRANCH"; then
            echo "::error::Push failed. If the target branch advanced, rerun the workflow to rebuild and retest its latest revision; do not force-push or rebase the tested commit."
            exit 1
          fi
