name: Update Initial SQL File

on:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write


jobs:
  update-sql:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98
      with:
        token: ${{ secrets.LANDER_GH_TOKEN }}
    - uses: canonical/launch-workshop@b9e184e38f49808ced78e25de19483fe02484c46 # v1.0.1
      with:
        cache: |
          go:mod-cache
          uv:cache

    - name: Update and Commit
      run: |
        workshop run -- update-initial-sql
        git config user.name "${{ vars.LANDER_USERNAME }}"
        git config user.email "${{ vars.LANDER_EMAIL }}"
        git add src/maasserver/testing/initial.maas_test.sql
        git status
        if git diff --cached --quiet; then
          echo "No changes to commit"
          exit 0
        fi
        git commit -m "Update initial SQL"
        git push origin HEAD:master
