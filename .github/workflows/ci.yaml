name: CI check

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  save-pr-number:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Save PR number to artifact
        run: echo "${{ github.event.pull_request.number }}" > pr-number.txt
      - name: Upload PR number artifact
        uses: actions/upload-artifact@v4
        with:
          name: pr-number
          path: pr-number.txt

  changes:
    runs-on: ubuntu-24.04
    if: ${{ !github.event.pull_request.draft }}

    outputs:
      python: ${{ steps.filter.outputs.python }}
      go: ${{ steps.filter.outputs.go }}
      docs: ${{ steps.filter.outputs.docs }}
      lint: ${{ steps.filter.outputs.lint }}
    steps:
      - uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            lint:
              - 'src/**/*.py'
              - 'pyproject.toml'
              - 'tox.ini'
              - 'setup.py'
              - 'openapi.yaml'
              - 'Makefile'
              - 'utilities/**'
              - 'src/**/*.go'
              - 'src/**/go.mod'
              - 'src/**/go.sum'
              - 'src/**/Makefile'
              - 'snap/local/tree/usr/bin/*'
              - 'snap/snapcraft.yaml'
              - 'workshop.yaml'
              - '.workshop/**'
            python:
              - 'src/**/*.py'
              - 'utilities/generate_builders.py'
              - 'utilities/run-py-tests-ci'
              - 'pyproject.toml'
              - 'tox.ini'
              - 'workshop.yaml'
              - '.workshop/**'
            go:
              - 'src/**/*.go'
              - 'src/**/go.mod'
              - 'src/**/go.sum'
              - 'workshop.yaml'
              - '.workshop/**'
            docs:
              - 'docs/**'
              - 'src/**/*.py'
              - 'utilities/run-py-tests-ci'
              - 'pyproject.toml'
              - 'tox.ini'
              - 'snap/snapcraft.yaml'

  lint:
    runs-on: ubuntu-24.04
    needs: changes
    if: >-
      ${{ !github.event.pull_request.draft && needs.changes.outputs.lint == 'true' }}
    steps:
      - uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98
      - uses: canonical/launch-workshop@b9e184e38f49808ced78e25de19483fe02484c46 # v1.0.1
        with:
          cache: |
            go:mod-cache
            uv:cache

      - name: Build
        run: workshop run -- build

      - name: Run lint
        run: workshop run -- lint

  test-python:
    needs: changes
    runs-on: ubuntu-24.04
    if: >-
      ${{ !github.event.pull_request.draft && needs.changes.outputs.python == 'true' }}

    steps:
      - uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98
      - uses: canonical/launch-workshop@b9e184e38f49808ced78e25de19483fe02484c46 # v1.0.1
        with:
          cache: |
            go:mod-cache
            uv:cache

      - name: Build
        run: workshop run -- build

      - name: Test
        run: workshop run -- test-py

  test-go:
    needs: changes
    runs-on: ubuntu-24.04
    if: >-
      ${{ !github.event.pull_request.draft && needs.changes.outputs.go == 'true' }}

    steps:
      - uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98
      - uses: canonical/launch-workshop@b9e184e38f49808ced78e25de19483fe02484c46 # v1.0.1
        with:
          cache: |
            go:mod-cache
            uv:cache

      - name: Build
        run: workshop run -- build

      - name: Test
        run: workshop run -- test-go
  test-docs:
    needs: changes
    runs-on: ubuntu-24.04
    if: >-
      ${{ !github.event.pull_request.draft && needs.changes.outputs.docs == 'true' }}
    steps:
    - uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98
      with:
        fetch-depth: 0
    - name: Create venv
      working-directory: "docs"
      run: make install
    - name: Lint markdown
      working-directory: "docs"
      run: make lint-md
    - name: Test build
      working-directory: "docs"
      run: make html
    - name: Run scripts tests
      working-directory: "docs"
      run: |
        source .sphinx/venv/bin/activate
        pip install -r requirements-dev.txt
        cd _scripts && python -m pytest .

  ci-check:
    runs-on: ubuntu-slim
    if: always()
    needs: [lint, test-python, test-go, test-docs]
    steps:
      - name: Determine overall CI status
        id: status
        run: |
          # If any dependency failed or was cancelled, mark as failure
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "state=failure" >> $GITHUB_OUTPUT
          else
            echo "state=success" >> $GITHUB_OUTPUT
          fi

      - name: Fail pipeline if dependencies failed
        if: steps.status.outputs.state == 'failure'
        run: exit 1
