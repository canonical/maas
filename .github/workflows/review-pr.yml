name: LLM Code Review

# pull_request_target + issue_comment both run from the base branch (master),
# so the workflow always has access to repository secrets, even for fork PRs.
# We only ever READ the PR's files — we never execute code from the checkout.
on:
  pull_request_target:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: llm-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

env:
  MODEL: gemini-3.1-pro-preview
  SNAP_CHANNEL: stable

jobs:
  review:
    runs-on: ubuntu-latest
    # Run when a PR is opened, OR when someone comments "/review" on a PR
    # (issue_comment fires for both issues and PRs, so we check .pull_request).
    if: >
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request != null &&
       startsWith(github.event.comment.body, '/review') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))

    steps:
      # Resolve the PR number and head SHA. For pull_request_target these come
      # straight from the event; for issue_comment we look them up via the API.
      - name: Resolve PR context
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "issue_comment" ]; then
            PR_NUMBER="${{ github.event.issue.number }}"
          else
            PR_NUMBER="${{ github.event.pull_request.number }}"
          fi
          HEAD_SHA=$(gh api "repos/${{ github.repository }}/pulls/${PR_NUMBER}" --jq '.head.sha')
          echo "number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "head_sha=${HEAD_SHA}" >> "$GITHUB_OUTPUT"

      # Check out the PR HEAD so the LLM can read the actual files being
      # reviewed via --repo-dir. We do NOT run any code from this checkout.
      - name: Check out PR head (for file context)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ steps.pr.outputs.head_sha }}

      - name: Install maas-code-reviewer
        run: sudo snap install maas-code-reviewer --channel "$SNAP_CHANNEL"

      - name: Run maas-code-reviewer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          maas-code-reviewer review-pr \
            --model "$MODEL" \
            --repo-dir "$GITHUB_WORKSPACE" \
            --metrics "$RUNNER_TEMP/metrics.json" \
            "https://github.com/${{ github.repository }}/pull/${{ steps.pr.outputs.number }}"

      - name: Upload metrics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: review-metrics-pr${{ steps.pr.outputs.number }}
          path: ${{ runner.temp }}/metrics.json
          retention-days: 30
