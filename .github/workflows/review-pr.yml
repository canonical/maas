name: LLM Code Review

# pull_request_target + issue_comment both run from the base branch (master),
# so the workflow always has access to repository secrets, even for fork PRs.
# We only ever READ the PR's files — we never execute code from the checkout.
on:
  pull_request_target:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: llm-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

env:
  MODEL: gemini-3.1-pro-preview
  SNAP_CHANNEL: stable

jobs:
  review:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request != null &&
       startsWith(github.event.comment.body, '/review') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))

    steps:
      - name: Resolve PR context
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PR_NUMBER_EVENT: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ "$EVENT_NAME" = "issue_comment" ]; then
            PR_NUMBER="$ISSUE_NUMBER"
          else
            PR_NUMBER="$PR_NUMBER_EVENT"
          fi
          HEAD_SHA=$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')
          echo "number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "head_sha=${HEAD_SHA}" >> "$GITHUB_OUTPUT"

      - name: Check out PR head (for file context)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ steps.pr.outputs.head_sha }}

      - name: Install maas-code-reviewer
        run: sudo snap install maas-code-reviewer --channel "$SNAP_CHANNEL"

      - name: Run maas-code-reviewer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          maas-code-reviewer review-pr \
            --model "$MODEL" \
            --repo-dir "$GITHUB_WORKSPACE" \
            --metrics "$RUNNER_TEMP/metrics.json" \
            "https://github.com/${{ github.repository }}/pull/${{ steps.pr.outputs.number }}"

      - name: Upload metrics
        if: always() && steps.pr.outputs.number != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: review-metrics-pr${{ steps.pr.outputs.number }}
          path: ${{ runner.temp }}/metrics.json
          retention-days: 30
